<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CREDICARROS · Verificação de ecrãs</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9edf2; color: #183554; font-family: system-ui, sans-serif; }
    header { padding: 16px 20px; background: white; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
    h1 { margin: 0 14px 0 0; font-size: 16px; }
    button, select { min-height: 44px; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #0963e6; color: #fff; border-color: #0963e6; }
    label { display: flex; align-items: center; gap: 8px; }
    main { padding: 20px; display: flex; justify-content: center; overflow: auto; }
    iframe { flex: none; width: 390px; height: 844px; border: 0; border-radius: 20px; box-shadow: 0 12px 45px #18355425; background: #dceeff; }
  </style>
</head>
<body>
  <header>
    <h1>Verificação de ecrãs</h1>
    <button type="button" data-width="360" aria-pressed="false">360 px</button>
    <button type="button" data-width="390" aria-pressed="true">390 px</button>
    <button type="button" data-width="440" aria-pressed="false">440 px</button>
    <label>Altura <select id="height"><option value="844">844 px</option><option value="1120">1120 px</option></select></label>
  </header>
  <main><iframe id="preview" src="../index.html" title="Simulador no ecrã selecionado"></iframe></main>
  <script>
    const preview = document.getElementById('preview');
    document.querySelectorAll('[data-width]').forEach(button => {
      button.addEventListener('click', () => {
        preview.style.width = `${button.dataset.width}px`;
        document.querySelectorAll('[data-width]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
      });
    });
    document.getElementById('height').addEventListener('change', event => {
      preview.style.height = `${event.target.value}px`;
    });
  </script>
</body>
</html>
